<!DOCTYPE html>
<html>
<head>
    <title>Technology Suggestion Form</title>
</head>

<body>

<header>
    <h1>Emerging Technologies Information Portal</h1>
    <p>Suggest a New Technology</p>

    <nav>
        <a href="#">Home</a> |
        <a href="#">Suggest Technology</a>
    </nav>
</header>

<h2>Technology Suggestion Form</h2>

<form>

    <label>Name:</label><br>
    <input type="text" name="name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Contact Number:</label><br>
    <input type="tel" name="contact"><br><br>

    <label>Technology Name:</label><br>
    <input type="text" name="technology"><br><br>

    <label>Technology Category:</label><br>
    <select name="category">
        <option>Select Category</option>
        <option>Artificial Intelligence</option>
        <option>Cloud Computing</option>
        <option>Cyber Security</option>
        <option>Internet of Things</option>
    </select>
    <br><br>

    <label>Technology Type:</label><br>
    <input type="radio" name="type" value="software"> Software
    <input type="radio" name="type" value="hardware"> Hardware
    <br><br>

    <label>Application Areas:</label><br>
    <input type="checkbox" name="area" value="education"> Education
    <input type="checkbox" name="area" value="healthcare"> Healthcare
    <input type="checkbox" name="area" value="finance"> Finance
    <input type="checkbox" name="area" value="industry"> Industry
    <br><br>

    <label>Year Introduced:</label><br>
    <input type="number" name="year">
    <br><br>

    <label>Technology Website:</label><br>
    <input type="url" name="website">
    <br><br>

    <label>Date of Submission:</label><br>
    <input type="date" name="date">
    <br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="5" cols="50"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

<footer>
    <p>Emerging Technologies Information Portal | Web Programming Laboratory</p>
</footer>

</body>
</html>
