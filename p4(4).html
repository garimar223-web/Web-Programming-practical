<!--Suggest Technology-->
<section>
<h2>Suggest a technology</h2>

<p>
Use the following form to suggest an emerging technology that can be added to the portal
</p>

<form>
<label><b>Technology name :</b></label><br>
<input type="text" name="technology" size="30"><br><br>

<label><b>Organization name :</b></label><br>
<input type="text" name="organisation" size="30"><br><br>

<!--Technology Category-->
<label>Technology Category</label><br>
<select name="category</label><br>
<select name="category">
<option>Artificial Intelligence</option>
<option>Cloud Computing</option>
<option>Cyber Security</option>
<option>IoT</option>
<option>Blockchain</option>
</select><br><br>
<!--Technology Impact Level-->
<label>Technology Impact Level : </label><br><br>

<input type="radio" name="impact" value="High">
<label>High</label><br>

<input type="radio" name="impact" value="Medium">
<label>Medium</label><br>

<input type="radio" name="impact" value="Low">
<label>Low</label><br>
</label>
<br><br>

<!--Application Areas-->
<label>Application Areas</label><br><br>
<input type="checkbox" name="application" value="Education">Education<br>
<input type="checkbox" name="application" value="Finance">Finance<br>
<input type="checkbox" name="application" value="Healthcare">Healthcare<br>
<input type="checkbox" name="application" value="Manufacturing">Manufacturing<br>
<input type="checkbox" name="application" value="Transportation">Transportation<br>

<label><b>Description  :</b></label><br>
<textarea name="description" rows="6" cols="40"></textarea><br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</section>


<hr>
<!--Footer-->
<footer>

</footer>
</body>
</html>
